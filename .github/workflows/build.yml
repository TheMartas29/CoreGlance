name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift build (no warnings allowed)
        shell: bash
        run: |
          swift build 2>&1 | tee build.log
          ! grep -i 'warning:' build.log
      - name: Swift test (no warnings allowed)
        shell: bash
        run: |
          swift test 2>&1 | tee test.log
          ! grep -i 'warning:' test.log
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent CoreGlance.app CoreGlance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGlance
          path: build/CoreGlance.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CoreGlance
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" CoreGlance.zip --generate-notes
