name: Build

# Runnery: self-hosted puppet Mac (label puppet-ci, zdarma; fronta max 3 joby / 1 Xcode, viz puppetmaster docs/ci-runner.md).
# Nouzově GitHub-hosted: proměnné repa CI_RUNNER=ubuntu-latest a CI_RUNNER_XCODE=macos-26 (Settings → Variables).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER_XCODE || 'puppet-ci' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent CoreGlance.app CoreGlance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGlance
          path: build/CoreGlance.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CoreGlance.zip --generate-notes
