name: Build

# Runnery: self-hosted puppet Mac (label puppet-ci, zdarma; fronta max 3 joby / 1 Xcode, viz puppetmaster docs/ci-runner.md).
# Nouzově GitHub-hosted: proměnné repa CI_RUNNER=ubuntu-latest a CI_RUNNER_XCODE=macos-26 (Settings → Variables).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER_XCODE || 'puppet-ci' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release script tests (check-version, release-notes)
        run: sh scripts/test-check-version.sh
      # The automated release commit bumps only CHANGELOG.md, so Resources/Info.plist is not compared here;
      # the app's Info.plist gets the tag version from apply-version.sh during the build.
      - name: Check tag matches CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/check-version.sh --skip-plist
      - name: Swift build (no warnings allowed)
        shell: bash
        run: |
          swift build 2>&1 | tee build.log
          ! grep -i 'warning:' build.log
      - name: Swift test (no warnings allowed)
        shell: bash
        run: |
          swift test 2>&1 | tee test.log
          ! grep -i 'warning:' test.log
      - name: Version script tests
        shell: bash
        run: bash scripts/test-apply-version.sh
      - name: Build universal app
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"; export VERSION; fi
          scripts/build-app.sh
      - name: Check version in built app
        shell: bash
        run: |
          PLIST=build/CoreGlance.app/Contents/Info.plist
          got_build="$(plutil -extract CFBundleVersion raw "$PLIST")"
          got_ver="$(plutil -extract CFBundleShortVersionString raw "$PLIST")"
          echo "app version $got_ver ($got_build)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$got_ver" != "${GITHUB_REF_NAME#v}" ]; then
            echo "expected version ${GITHUB_REF_NAME#v}"; exit 1
          fi
          if [ "$GITHUB_RUN_NUMBER" -gt 5 ] && [ "$got_build" != "$GITHUB_RUN_NUMBER" ]; then
            echo "expected build number $GITHUB_RUN_NUMBER"; exit 1
          fi
      - name: Zip
        run: cd build && ditto -c -k --keepParent CoreGlance.app CoreGlance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGlance
          path: build/CoreGlance.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CoreGlance
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" CoreGlance.zip --notes-file release-notes.md
