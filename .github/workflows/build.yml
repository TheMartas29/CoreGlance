name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: scripts/build-app.sh
      - name: Zip
        run: cd build && ditto -c -k --keepParent CoreGlance.app CoreGlance.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CoreGlance
          path: build/CoreGlance.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/CoreGlance.zip --generate-notes
