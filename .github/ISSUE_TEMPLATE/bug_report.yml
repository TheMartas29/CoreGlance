name: Bug report
description: Something is wrong or a value looks off
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Air 13" M4, 2025
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5"
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Diagnostics
      description: Output of `/Applications/CoreGlance.app/Contents/MacOS/CoreGlance --dump`
      render: text
    validations:
      required: true
