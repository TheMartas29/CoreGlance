name: Compatibility report
description: Tell us how CoreGlance works on your Mac (helps fill the compatibility table)
labels: [compatibility]
body:
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14" M3 Pro
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works correctly?
      options:
        - label: CPU usage and P/E split
        - label: CPU frequency (GHz)
        - label: GPU usage and frequency
        - label: CPU / GPU temperature
        - label: Battery temperature
        - label: Power (watts)
        - label: Fans
  - type: textarea
    id: dump
    attributes:
      label: Diagnostics
      description: |
        The full output is far too long to paste (about 800 kB; GitHub allows 65,536 characters). Attach it as a file instead:
        in CoreGlance open Settings → General → **Save diagnostics…** and drag the saved `.txt` file into this box.
        Alternatively run `/Applications/CoreGlance.app/Contents/MacOS/CoreGlance --dump > diagnostics.txt` in Terminal and attach `diagnostics.txt`.
        The file contains no user name, computer name or home folder path; nothing is sent anywhere, you attach it yourself.
    validations:
      required: true
