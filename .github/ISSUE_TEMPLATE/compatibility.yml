name: Compatibility report
description: Tell us how CoreGlance works on your Mac (helps fill the compatibility table)
labels: [compatibility]
body:
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Pro 14" M3 Pro
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works correctly?
      options:
        - label: CPU usage and P/E split
        - label: CPU frequency (GHz)
        - label: GPU usage and frequency
        - label: CPU / GPU temperature
        - label: Battery temperature
        - label: Power (watts)
        - label: Fans
  - type: textarea
    id: dump
    attributes:
      label: Diagnostics
      description: Output of `/Applications/CoreGlance.app/Contents/MacOS/CoreGlance --dump`
      render: text
    validations:
      required: true
